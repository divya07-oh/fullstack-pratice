<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <title>Focus Pulse</title>
    <style>
        * {
            box-sizing:border-box;
            font-family: 'Courier New', monospace;
        }
        body {
            background: #0d1117;
            color: #e6edf3;
            display: flex;
            justify-content: center;
            padding:30px 15px;
        }
        .wrap {
            width:100%;
            max-width:640px;
        }
        h1 {
            font-size:20px;
            color: #58a6ff;
            margin-bottom: 18px;
        }
        .sub {
            color: #8b949e;
            font-size: 13px; 
            margin-bottom:18px;
        }
        .stat-row {
            display:flex;
            gap:10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .stat-box {
            flex:1;
            min-width:110px;
            background: #161b22;
            border:1px solid #30363d;
            border-radius:8px;
            padding:10px 12px;
        }
        .stat-box .label {
            font-size:11px;
            color: #8b949e;
        }
        .stat-box .value {
            font-size: 22px;
            color: #3fb950;
            font-weight:bold;
        }
        .stat-box.warn .value {
            color: #f0883e;
        }
        .stat-box.bad .value {
            color: #f85149;
        }
        #passageBox {
            background: #161b22;
            border:1px solid #30363d;
            border-radius: 8px;
            padding:14px;
            font-size:15px;
            line-height:1.7;
            margin-bottom:12px;
            user-select: none;
        }
        .char-correct {
            color:#3fb950;
        }
        .char-wrong {
            color: #f81549;
            background: rgba(248,81,73,0.15);
        }
        .char-pending {
           color:#6e7681;
        }
        .char-current {
           border-bottom: 2px solid #58a6ff;
        }
        textarea {
           width:100%;
           height:70px;
           background: #0d1117;
           border-radius: 8px;
           padding: 10px;
           color: #e6edf3;
           font-size: 14px;
           resize: none;
        }
        button {
            margin-top: 10px;
            padding: 9px 14px;
            background: #238636;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;  
         }
         button:hover {
            background: #2ea043;
         }
         button.secondary {
            background: #30363d;
        }
        button.secondary:hover {
               background: #3d444d;
        }  
        canvas {
            margin-top: 14px;
            background: #161b22;
            border: 1px solid #30363d;
            width: 100%;
            height: 140px;
        }
        #history {
            margin-top: 14px;
            font-size: 13px;
            color: #8b949e;
            max-height: 110px;
            overflow-y: auto;
        }
        #history div {
            padding: 3px 0;
            border-bottom: 1px dashed #30363d;
        }
    </style>
    </head>
    <body>
         
        <div clss="wrap">
            <h1>FocusPulse</h1>
            <div class="sub">Real-time typing speed &amp; focus analysics - no libraries, pure JS.</div>
            <div class="stat.row">
            <div class="stat.box"><div class="label">LIVE WPM</div><div class="value" id="wpmstat">0</div></div>
            <div class="stat-box" id="accBox"><div class="label">ACCURACY</div><div class="value" id="accStat">100%</div></div>
            <div class="stat-box"><div class="label">TIME LEFT</div><div class="value" id="timeStat">60</div></div>
            <div class="stat-box"><div class="label">BEST WPM</div><div class="value" id="bestStat">0</div></div>
        </div>
            <div id="passageBox"></div>
 
        <textarea id="typedInput" placeholder="Click here and start typing to begin the session..." disabled></textarea>
        <br>
        <button onclick="startSession()">Start Session</button>
        <button class="secondary" onclick="resetAll()">Reset All Data</button>
 

        <canvas id="chart"></canvas>
 
        <div id="history"></div>
    </div>
    <script>

        const passages = [
           "Consistency beats intensity when you are building a real skill.",
           "Every bug you fix teaches you something a tutorial never could.",
           "Small daily progress compounds into skills nobody can take away.",
           "Real developers are not people who never fail, they are people who keep debugging."
        ];
         let state = {
            passage: "",
            startTime: null,
            timerId: null,
            timeleft: 60,
            totalTyped: 0,
            correctChars: 0,
            wpmHistory: [],
            sessionHistory: [],
            bestWpm: 0,
            isRunning: false,
         };
        
        const passageBox = document.getElementById("passageBox");
        const typedInput = document.getElementById("typedInput");
        const wpmStart = document.getElementById("wpmStart");
        const accStart = document.getElementById("accStart");
        const accBox = document.getElementById("accBox");
        const timeStat = document.getElementById("timeStat");
        const bestStat = document.getElementById("bestStat");
        const historyBox = document.getElementById("history");
        const canvas = document.getElementById("chart");
        const ctx = document.getElementById("2d");
    </script>
    
    </body>
</html>
